version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: wordpress-eef-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress_user
      MYSQL_PASSWORD: wordpress_password_here
    volumes:
      # Stores all database files directly in your host path
      - /home/planet/Docker/wp-eef/wordpress-local/db_data:/var/lib/mysql

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wordpress-eef-wp
    restart: always
    ports:
      - "192.168.1.250:1248:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress_user
      WORDPRESS_DB_PASSWORD: wordpress_password_here
      WORDPRESS_DB_NAME: wordpress
    volumes:
      # Stores all WordPress files (wp-content, themes, uploads) in your host path
      - /home/planet/Docker/wp-eef/wordpress-local/wp_data:/var/www/html
      # Mounts your XML folder into the container so you can find it during import
      - /home/planet/Docker/wp-eef/wordpress-local/import:/mnt/import
